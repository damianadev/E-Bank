<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>DJBank</title>

</head>
<body>
    <header>
        <nav>
            <div class="djbank-title">
                <img src="/assets/djcoin-256px.png" alt="" id="djIcon">
                <h1>DJBank</h1>
            </div>
        </nav>
    </header>
    
    <main>
        <section class="overview">
            <div>
                <h1>Overview</h1>
                <hr>
                <h2> <span id="currentUser"></span> </h2>
                <h2> <span id="currentIban"></span></h2>
            </div>

            <div class="balance">    
                <h1> <span id="currentBalance"></span></h1>
                <img src="assets/djcoin-128px.png" alt="" id="djIcon">
            </div>
        </section>

        <section class="sendRequestWndw">
            <div class="sendWndw">
                <div class="sendInput">
                    <input type="text" placeholder="Enter a beneficiary name..">
                    <input type="text" placeholder="Enter a beneficiary IBAN..">
                    <input type="number" placeholder="0.00">
                </div>
            </div>

            <div class="requestWndw">
                <div class="requestInput">
                    <input type="text" placeholder="Enter a request beneficiary name..">
                    <input type="text" placeholder="Enter a request beneficiary IBAN..">
                    <input type="number" placeholder="0.00">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <section>
            <div class="openButtons">
                <button id="openSendWndw" class="openBtn"> Send Money </button>
                <button id="openRequestWndw" class="openBtn"> Request Money </button>
            </div>
        </section>
    </footer>



    <script src="script.js"></script>
</body>
</html>
