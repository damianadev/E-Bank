<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>DJBank</title>

</head>
<body>
    <header>
        <nav>
            <div class="djbank-title">
                <img src="/assets/djcoin-256px.png" alt="" class="djIcon">
                <h1>DJBank</h1>
            </div>

            <div class="icons">
                <button id="openLoginBtn">Login/Switch user</button>
            </div>
        </nav>
    </header>
    
    <main>
        <section class="overview">
            <div>
                <h1>Overview</h1>
                <hr>
                <h2> <span id="userOutput"></span> </h2>
                <h2> <span id="currentIban"></span></h2>
            </div>

            <div class="balance">    
                <h1 id="currentBalance">0</h1>
                <button id="clickBtn">
                    <img src="assets/djcoin-128px.png" alt="" class="djIcon">
                </button>
            </div>
        </section>

        <section class="loginWndw">
            <div class="loginHide">
                <div class="login">

                <h1>Login/Switch user</h1>

                <input type="text" placeholder="Enter your username.." id="userInput">
                <button id="saveUserBtn">SAVE</button>
            
                </div>
            </div>
        </section>

        <section class="sendRequestWndw">
            <div class="sendWndw">
                <h1>New payment</h1>
                <hr>
                <div class="sendInput">
                    <h4>Beneficiary name</h4>
                    <input type="text" placeholder="Enter a beneficiary name..">
                    <h4>IBAN</h4>
                    <input type="text" placeholder="Enter a beneficiary IBAN..">
                    <h4>Amount</h4>
                    <input type="number" placeholder="0.00">
                </div>
            </div>

            <div class="requestWndw">
                <h1>New payment request</h1>
                <hr>
                <div class="requestInput">
                    <h4>Beneficiary name</h4>
                    <input type="text" placeholder="Enter a request beneficiary name..">
                    <h4>IBAN</h4>
                    <input type="text" placeholder="Enter a request beneficiary IBAN..">
                    <h4>Amount</h4>
                    <input type="number" placeholder="0.00">
                </div>
            </div>
        </section>

    </main>

    <footer>
        <section>
            <div class="openButtons">
                <button id="openSendWndw" class="openBtn"> Send Money </button>
                <button id="openRequestWndw" class="openBtn"> Request Money </button>
            </div>
        </section>
    </footer>


    <script src="script.js"></script>
</body>
</html>
